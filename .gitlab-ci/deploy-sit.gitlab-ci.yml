build_cocos_sit:
  extends:
    - .build_cocos
    - .deploy:sit:rules
  environment:
    name: SIT

build_game_image_sit:
  stage: build
  extends:
    - .build_image
    - .deploy:sit:rules
  needs: ['build_cocos_sit']
  dependencies:
    - build_cocos_sit
  environment:
    name: SIT

post_build_sit:
  extends:
    - .post_build
    - .deploy:sit:rules
  needs: ['build_game_image_sit']
  environment:
    name: SIT

deploy_sit:
  extends:
    - .base_deploy_swarm_service
    - .deploy:sit:rules
  needs: ['post_build_sit']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_SIT
    SERVER_USER: $SC_SWARM_LEADER_SIT_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_SIT_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_SIT
    SWARM_REPLICAS: 2
    NODE_LABEL: L1
    DOCKER_PUBLIC_PORT: 6100
    DOCKER_PRIVATE_PORT: 80
  environment:
    name: SIT
