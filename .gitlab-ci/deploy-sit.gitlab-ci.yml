build_cocos_sit:
  extends:
    - .build_cocos
    - .deploy:sit:rules
  environment:
    name: SIT

build_game_image_sit:
  stage: build
  extends:
    - .build_image
    - .deploy:sit:rules
  needs: ['build_cocos_sit']
  dependencies:
    - build_cocos_sit
  environment:
    name: SIT

post_build_sit:
  extends:
    - .post_build
    - .deploy:sit:rules
  needs: ['build_game_image_sit']
  environment:
    name: SIT

deploy_sit:
  extends:
    - .base_deploy_kbt
    - .deploy:sit:rules
  needs: ['post_build_sit']
  variables:
    SERVER_IP: $SIT_IP
    SERVER_USER: $SIT_USER
    SERVER_PORT: $SIT_SSH_PORT
    DOCKER_PUBLIC_PORT: 6100
    DOCKER_PRIVATE_PORT: 80
  environment:
    name: SIT
