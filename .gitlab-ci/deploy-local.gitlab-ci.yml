build_cocos_local:
  extends:
    - .build_cocos
    - .deploy:local:rules
  environment:
    name: LOCAL

build_game_image_local:
  stage: build
  extends:
    - .build_image
    - .deploy:local:rules
  needs: ['build_cocos_local']
  dependencies:
    - build_cocos_local
  environment:
    name: LOCAL

post_build_local:
  extends:
    - .post_build
    - .deploy:local:rules
  needs: ['build_game_image_local']
  environment:
    name: LOCAL

deploy_local:
  extends:
    - .base_deploy_swarm_service
    - .deploy:local:rules
  needs: ['post_build_local']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_LOCAL
    SERVER_USER: $SC_SWARM_LEADER_LOCAL_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_LOCAL_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_LOCAL
    SWARM_REPLICAS: 1
    NODE_LABEL: L1
    DOCKER_PUBLIC_PORT: 8000
    DOCKER_PRIVATE_PORT: 80
    DOCKER_NETWORK_NAME: lumi-network
  environment:
    name: LOCAL
