build_cocos_prod:
  extends:
    - .build_cocos
    - .deploy:prod:rules
  script:
    - echo "====== Build Cocos Web Mobile ======"
    - cp ./assets/_new-assets/Configs.${DEPLOY_ENV}.js ./assets/_new-assets/Configs.js
    - cp ./build-files/web/index-${DEPLOY_ENV}.html ./build-templates/web-mobile/index.html
    - /Applications/CocosCreator/Creator/2.4.0/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;webOrientation=landscape;md5Cache=true"
  environment:
    name: PROD

build_game_image_prod:
  stage: build
  extends:
    - .build_image
    - .deploy:prod-auto:rules
  needs: ['build_cocos_prod']
  dependencies:
    - build_cocos_prod
  environment:
    name: PROD

post_build_prod:
  extends:
    - .post_build
    - .deploy:prod-auto:rules
  needs: ['build_game_image_prod']
  environment:
    name: PROD

deploy_prod:
  extends:
    - .base_deploy_swarm_service
    - .deploy:prod:rules
  needs: ['post_build_prod']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_PROD
    SERVER_USER: $SC_SWARM_LEADER_PROD_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_PROD_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_PROD
    SWARM_REPLICAS: 2
    NODE_LABEL: L1_GAMES
    DOCKER_PUBLIC_PORT: 8100
    DOCKER_PRIVATE_PORT: 80
    DOCKER_NETWORK_NAME: lumi-network
  environment:
    name: PROD
