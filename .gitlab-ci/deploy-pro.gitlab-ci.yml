build_cocos_prod:
  extends:
    - .build_cocos
    - .deploy:prod:rules
  script:
    - echo "====== Build Cocos Web Mobile ======"
    - cp ./assets/_new-assets/Configs.${CI_ENVIRONMENT_NAME}.js ./assets/_new-assets/Configs.js
    - cp ./build-files/web/index-${CI_ENVIRONMENT_NAME}.html ./build-templates/web-mobile/index.html
    - /Applications/CocosCreator/Creator/2.4.0/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;webOrientation=landscape;md5Cache=true"
  environment:
    name: PRO

build_game_image_prod:
  stage: build
  extends:
    - .build_image
    - .deploy:prod-auto:rules
  needs: ['build_cocos_prod']
  dependencies:
    - build_cocos_prod
  environment:
    name: SIT

post_build_prod:
  extends:
    - .post_build
    - .deploy:prod-auto:rules
  needs: ['build_game_image_prod']
  environment:
    name: PROD

deploy_prod:
  extends:
    - .base_deploy_kbt
    - .deploy:prod:rules
  needs: ['post_build_prod']
  variables:
    SERVER_IP: $PROD_IP
    SERVER_USER: $PROD_USER
    SERVER_PORT: $PROD_SSH_PORT
    DOCKER_PUBLIC_PORT: 8100
    DOCKER_PRIVATE_PORT: 80
  environment:
    name: PROD
