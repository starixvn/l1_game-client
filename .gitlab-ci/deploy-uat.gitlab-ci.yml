build_cocos_uat:
  extends:
    - .build_cocos
    - .deploy:uat:rules
  environment:
    name: UAT

build_game_image_uat:
  stage: build
  extends:
    - .build_image
    - .deploy:uat:rules
  needs: ['build_cocos_uat']
  dependencies:
    - build_cocos_uat
  environment:
    name: UAT

post_build_uat:
  extends:
    - .post_build
    - .deploy:uat:rules
  needs: ['build_game_image_uat']
  environment:
    name: UAT

deploy_uat:
  extends:
    - .base_deploy_swarm_service
    - .deploy:uat:rules
  needs: ['post_build_uat']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_SIT
    SERVER_USER: $SC_SWARM_LEADER_SIT_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_SIT_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_SIT
    SWARM_REPLICAS: 2
    NODE_LABEL: L1
    DOCKER_PUBLIC_PORT: 7100
    DOCKER_PRIVATE_PORT: 80
    DOCKER_NETWORK_NAME: lumi-network
  environment:
    name: UAT
