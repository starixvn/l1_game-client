local_deploy_web:
  extends: .push-git-compiled-web
  environment:
    name: LOCAL
  rules:
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-local-web-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-web-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-\d{8}-\d+.*$/
      when: always

