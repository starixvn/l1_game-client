local_deploy_web:
  extends: .push-git-compiled-web
  script:
    - echo "====== Build Cocos Web Mobile ======"
    - echo "{\"release\":\"${CI_COMMIT_SHA:1}\"}" > ./assets/_new-assets/sentryConfig.json
    - cp ./assets/_new-assets/Configs.${CI_ENVIRONMENT_NAME}.js ./assets/_new-assets/Configs.js
    - /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;webOrientation=landscape;md5Cache=true"
    - echo "====== Deploying to server ======"
    - tar czf - ./build/web-mobile/* | ssh root@$LOCAL_SERVER "cd /var/www/l1/game-client/web-mobile && tar xvzf -"
  environment:
    name: LOCAL
  only:
    - /^deploy-local-web-\d{8}-\d+.*$/
    - /^deploy-web-\d{8}-\d+.*$/
    - /^deploy-\d{8}-\d+.*$/

