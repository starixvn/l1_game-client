.game-test:
    stage: test
    trigger:
        include:
            - local: ci/cocos-testing-ci.yaml
    allow_failure: true

include:
    - project: "ci/core-cicd"
      ref: main
      file: "luminet.gitlab-ci.yml"

    - project: "ci/repos-ci/pentagon_l2_four_guardians_2_client"
      ref: master
      file: "gitlab-ci-mixing.yml"

    - project: "ci/repos-ci/pentagon_l2_four_guardians_3_client"
      ref: master
      file: "gitlab-ci-mixing.yml"

    - project: "ci/repos-ci/pentagon_l2_happy_fish_jackpot_client"
      ref: master
      file: "gitlab-ci-mixing.yml"

    - local: "ci/*.yml"

variables:
    COCOS_VERSION: 2.4.6

bundle-verification:
    stage: build
    image: hub.lumigame.com/docker-hub/library/node:18.14-alpine
    tags:
        - docker
    before_script:
        - npm set registry http://npm.lumigame.com
        - yarn global add fs-extra
        - yarn install
    script:
        - node ./test_bundle/bundle_verification.js
    rules:
        - if: $CI_COMMIT_TAG =~ /^deploy- */ && $DEPLOY_BY == "rocketor"
          when: on_success
        - when: never
    allow_failure: false
