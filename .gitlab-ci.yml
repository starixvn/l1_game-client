variables:
  GIT_COMPILED_REPO: git@gitlab.com:l1-compiled/game-client-compiled.git
  LOCAL_SERVER: 124.158.13.228
stages:
  - build
  - deploy

before_script:
  - echo "====== Build Cocos Web Mobile ======"
  - eval $(ssh-agent -s)
  - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)

build:
  stage: build
  script:
    - /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;mergeStartScene=true;webOrientation=auto"
  tags:
    - deploy-cocos-web-mobile
  only:
    - master

mobile_deploy_ios_testflight:
  stage: deploy
  script:
    - echo "====== Build Cocos Web Mobile ======"
    - mkdir -p ~/.ssh
    - /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=ios;optimizeHotUpdate=true"
    - cp -R ./build-files/ios/ ./build/jsb-link/frameworks/runtime-src/proj.ios_mac/
    - cd ./build/jsb-link/frameworks/runtime-src/proj.ios_mac/
    - fastlane beta
  tags:
    - deploy-cocos-ios-tf
  environment:
    name: iOS-TF
  only:
    - /^deploy-ios-\d{8}-\d+.*$/
    - /^deploy-\d{8}-\d+.*$/

dev_deploy_web:
  stage: deploy
  script:
    - echo "====== Build Cocos Web Mobile ======"
    - /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;mergeStartScene=true;webOrientation=landscape;md5Cache=true"
    - echo "====== Deploying to server ======"
    - tar czf - ./build/web-mobile/* | ssh root@$LOCAL_SERVER "cd /var/www/l1-dev/game-client/web-mobile && tar xvzf -"
  tags:
    - deploy-cocos-web-mobile
  environment:
    name: DEV
  only:
   - /^deploy-dev-web-\d{8}-\d+.*$/
   

local_deploy_web:
  stage: deploy
  script:
    - echo "====== Build Cocos Web Mobile ======"
    - /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;mergeStartScene=true;webOrientation=landscape;md5Cache=true"
    - echo "====== Deploying to server ======"
    - tar czf - ./build/web-mobile/* | ssh root@$LOCAL_SERVER "cd /var/www/l1/game-client/web-mobile && tar xvzf -"
  tags:
    - deploy-cocos-web-mobile
  environment:
    name: LOCAL
  only:
   - /^deploy-local-web-\d{8}-\d+.*$/
   - /^deploy-web-\d{8}-\d+.*$/
   - /^deploy-\d{8}-\d+.*$/
   
sit_deploy_web:
  stage: deploy
  script:
    - echo "====== Build Cocos Web Mobile ======"
    - cp ./assets/_new-assets/Configs.SIT.js ./assets/_new-assets/Configs.js
    - /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;mergeStartScene=true;webOrientation=landscape;md5Cache=true"
    - echo "====== Push to git compiled ======"
    - git clone --branch SIT $GIT_COMPILED_REPO ./publish
    - cp -R ./build/web-mobile/* ./publish
    - cp ./gitlab-ci-after-script-SIT.sh ./publish
    - cd ./publish
    - git add .
    - if [ -z "$(git status --porcelain)" ]; 
      then 
        echo "Nothing change"; 
      else 
       git commit -m "$COMMIT_MESSAGE"; git push -u origin SIT;
       echo "==============Waiting for after script execution==============";
       sleep 60; 
      fi
  tags:
    - deploy-cocos-web-mobile
  environment:
    name: SIT
  only:
   - /^deploy-sit-web-\d{8}-\d+.*$/
   - /^deploy-web-\d{8}-\d+.*$/
   - /^deploy-\d{8}-\d+.*$/

