stages:
  - build
  - deploy
  - post-deploy

before_script:
  - echo $CURRENT_TAG
  - if echo "$CI_COMMIT_TAG" | grep -q "$CURRENT_TAG";
    then
      echo "Continue deploying";
    elif [ "$CI_ENVIRONMENT_NAME" == "PRO" ]; then
      echo "Continue deploying";
    else
      echo "This job has tag is not used for current repository";
      exit 1;
    fi
  - echo "====== Build Cocos Web Mobile ======"
  - eval $(ssh-agent -s)
  - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
  - git config --global user.email "luminet.minigame.app@gmail.com"
  - git config --global user.name "Luminet"
  - if [ "$CI_ENVIRONMENT_NAME" == "PRO" ]; 
    then
      export GIT_BRANCH=master;
    else
      export GIT_BRANCH=$CI_ENVIRONMENT_NAME;
    fi
  - echo $GIT_BRANCH

build:
  stage: build
  script:
    - /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;webOrientation=landscape;md5Cache=true;sourceMaps=true"
  tags:
    - deploy-cocos-web-mobile
  only:
    - master
  artifacts:
    paths:
      - ./build/web-mobile/
    expire_in: 1 day

include:
  - local: .gitlab-ci-push-git-compiled-web.yml
  - local: .gitlab-ci-local.yml
  - local: .gitlab-ci-sit.yml
  - local: .gitlab-ci-uat.yml
  - local: .gitlab-ci-pro.yml
  - local: .gitlab-ci-ios.yml
