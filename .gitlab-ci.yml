image: docker:19.03.12
services:
  - docker:19.03.12-dind

variables:
  WORKING_PATH: /var/www/l1/game-client/
  DOCKER_SERVICE_NAME: l1-game-client
  DOCKER_IMAGE_PATH: l1/game-client
  PROJECT_NAME: l1-game-client

stages:
  - test
  - build_game
  - build
  - post-build
  - deploy

include:
  - project: 'lumi-ops/ci-scripts'
    ref: master
    file: 'sonarqube/sonarqube.gitlab-ci.yml'
  - project: 'lumi-ops/ci-scripts'
    ref: master
    file: 'docker/before-script-docker.gitlab-ci.yml'
  - project: 'lumi-ops/ci-scripts'
    ref: master
    file: 'rules/l1-rules.gitlab-ci.yml'
  - project: 'lumi-ops/ci-scripts'
    ref: master
    file: 'docker/build-docker-image-cocos.gitlab-ci.yml'
  - project: 'lumi-ops/ci-scripts'
    ref: master
    file: 'docker/post-build-docker-image.gitlab-ci.yml'
  - project: 'lumi-ops/ci-scripts'
    ref: master
    file: 'docker/deploy-docker-cocos.gitlab-ci.yml'
  - local: .gitlab-ci/build-cocos.gitlab-ci.yml
  - local: .gitlab-ci/deploy-local.gitlab-ci.yml
  - local: .gitlab-ci/deploy-sit.gitlab-ci.yml
  - local: .gitlab-ci/deploy-uat.gitlab-ci.yml
  - local: .gitlab-ci/deploy-pro.gitlab-ci.yml
