stages:
  # - deploy
  - deploy-web-mobile
  - deploy-ios-testflight
deploy-web-mobile:
  stage: deploy-web-mobile
  script:
    - echo "====== Build Cocos Web Mobile ======"
    - brew update
    - eval $(ssh-agent -s)
    # Add the SSH key stored in SSH_PRIVATE_KEY variable to the agent store
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;mergeStartScene=true;webOrientation=auto"
    - cp -R ./build-files/web-mobile/* ./build/web-mobile
    - scp -r -P 2201 ./build/web-mobile/* root@35.194.253.55:/var/www/r97/web-mobile
  tags:
    - deploy-cocos-web-mobile
  only:
    - /^deploy-web-\d{8}-\d+.*$/
    - /^deploy-\d{8}-\d+.*$/

deploy-ios-testflight:
  stage: deploy-ios-testflight
  script:
    - echo "====== Build Cocos Web Mobile ======"
    - brew update
    - eval $(ssh-agent -s)
    # Add the SSH key stored in SSH_PRIVATE_KEY variable to the agent store
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=ios;optimizeHotUpdate=true"
    - cp -R ./build-files/ios/ ./build/jsb-link/frameworks/runtime-src/proj.ios_mac/
    - cd ./build/jsb-link/frameworks/runtime-src/proj.ios_mac/
    - fastlane beta
  tags:
    - deploy-cocos-ios-testflight
  only:
    - /^deploy-ios-\d{8}-\d+.*$/
    - /^deploy-\d{8}-\d+.*$/
