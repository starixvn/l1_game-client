variables:
  GIT_COMPILED_REPO: git@gitlab.com:l1-compiled/game-client-compiled.git
  LOCAL_SERVER: 124.158.13.228
stages:
  - build
  - deploy
  - post-deploy

before_script:
  - echo "====== Build Cocos Web Mobile ======"
  - eval $(ssh-agent -s)
  - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
  - git config --global user.email "luminet.minigame.app@gmail.com"
  - git config --global user.name "Luminet"
  - if [ "$CI_ENVIRONMENT_NAME" == "PRO" ]; 
    then
      export GIT_BRANCH=master;
    else
      export GIT_BRANCH=$CI_ENVIRONMENT_NAME;
    fi
  - echo $GIT_BRANCH

build:
  stage: build
  script:
    - /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;mergeStartScene=true;webOrientation=auto;sourceMaps=true"
  tags:
    - deploy-cocos-web-mobile
  only:
    - sentry
  artifacts:
    paths:
      - /build/web-mobile/
    expire_in: 1 day

include:
  - local: .gitlab-ci-push-git-compiled-web.yml
  - local: .gitlab-ci-local.yml
  - local: .gitlab-ci-sit.yml
  - local: .gitlab-ci-uat.yml
  - local: .gitlab-ci-pro.yml
  - local: .gitlab-ci-ios.yml
