image: docker:19.03.12

stages:
  - build_game
  - build
  - post-build
  - deploy
  # - post-deploy
  
services:
  - docker:19.03.12-dind



.build_cocos:
  stage: build_game
  script:
    - echo "====== Build Cocos Web Mobile ======"
    - cp ./assets/_new-assets/Configs.${CI_ENVIRONMENT_NAME}.js ./assets/_new-assets/Configs.js
    - /Applications/CocosCreator/Creator/2.4.0/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;webOrientation=landscape;md5Cache=true"
  tags:
    - cocos
  artifacts:
    paths:
      - ./build/web-mobile
    expire_in: 1 day

