stages:
  - build
  - deploy

build:
  stage: build
  script:
    - /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;mergeStartScene=true;webOrientation=auto"
  tags:
    - deploy-cocos-web-mobile
  only:
    - master

deploy-ios-testflight:
  stage: deploy
  script:
    - echo "====== Build Cocos Web Mobile ======"
    - eval $(ssh-agent -s)
    # Add the SSH key stored in SSH_PRIVATE_KEY variable to the agent store
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=ios;optimizeHotUpdate=true"
    - cp -R ./build-files/ios/ ./build/jsb-link/frameworks/runtime-src/proj.ios_mac/
    - cd ./build/jsb-link/frameworks/runtime-src/proj.ios_mac/
    - fastlane beta
  tags:
    - deploy-cocos-ios-tf
  environment:
    name: iOS-TF
  only:
    - /^deploy-ios-\d{8}-\d+.*$/
    - /^deploy-\d{8}-\d+.*$/
    
deploy-web-mobile_LOCAL:
  stage: deploy
  before_script:
    - echo "====== Build Cocos Web Mobile ======"
    - eval $(ssh-agent -s)
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;mergeStartScene=true;webOrientation=landscape;md5Cache=true"
  script:
    - echo "====== Deploying to server ======"
    - tar czf - ./build/web-mobile/* | ssh root@124.158.13.228 "cd /var/www/l1/game-client/web-mobile && tar xvzf -"
  tags:
    - deploy-cocos-web-mobile
  environment:
    name: LOCAL
  only:
   - /^deploy-local-web-\d{8}-\d+.*$/
   - /^deploy-web-\d{8}-\d+.*$/
   - /^deploy-\d{8}-\d+.*$/
   
deploy-web-mobile_SIT:
  stage: deploy
  before_script:
    - echo "====== Build Cocos Web Mobile ======"
    - eval $(ssh-agent -s)
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
    - cp ./assets/_new-assets/Configs.SIT.js ./assets/_new-assets/Configs.js
    - /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;mergeStartScene=true;webOrientation=landscape;md5Cache=true"
  script:
    - echo "====== Push to git compiled ======"
    - git clone git@gitlab.com:l1-compiled/game-client-compiled.git ./publish
    - cp -R ./build/web-mobile/* ./publish
    - cd ./publish
    - git add .
    - if [ -z "$(git status --porcelain)" ]; then echo "Nothing change"; else git commit -m "$COMMIT_MESSAGE"; fi
    - git push -u origin master
  tags:
    - deploy-cocos-web-mobile
  environment:
    name: SIT
  only:
   - /^deploy-sit-web-\d{8}-\d+.*$/
   - /^deploy-web-\d{8}-\d+.*$/
   - /^deploy-\d{8}-\d+.*$/

