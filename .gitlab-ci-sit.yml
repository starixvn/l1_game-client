sit_deploy_web:
  extends: .push-git-compiled-web
  environment:
    name: SIT
    url: http://sit.saba.vin/
  rules:
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-sit-web-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-web-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-\d{8}-\d+.*$/
      when: always
    - when: never