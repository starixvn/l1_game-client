treasure-island-test:
    extends: .game-test
    variables:
        SOURCE_PATHS: ./assets/games/treasure-island,./assets/games/cascading-slot
        TEST_PATHS: ./__tests__/games/cascading-slot
        PROJECT_NAME: treasure_island_client
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'
          changes:
              - assets/games/cascading-slot/**/*
              - assets/games/treasure-island/**/*
              - __tests__/games/cascading-slot/**/*
        - when: never
